<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 263" width="410" height="263" role="img" aria-labelledby="title desc">
  <title id="title">Voltage-current graphs for conductors A and B</title>
  <desc id="desc">Both straight lines pass through zero. At one ampere line A reads six volts and line B reads three volts.</desc>
  <rect x="1" y="1" width="408" height="261" rx="10" fill="#fff" stroke="#cedbd5"/>
  <style>text {font-family: sans-serif; font-size: 16px; fill: #152c24} .wire {stroke:#254d3f;stroke-width:2.5;fill:none}</style>

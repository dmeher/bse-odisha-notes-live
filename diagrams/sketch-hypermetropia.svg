<svg xmlns="http://www.w3.org/2000/svg" width="750" height="610" viewBox="0 0 750 610" role="img" aria-labelledby="title desc"><title id="title">ଦୂର ଦୃଷ୍ଟି ଓ ତାହାର ସଂଶୋଧନ</title><desc id="desc">ପ୍ରଥମ ଧାଡ଼ିରେ ସ୍ପଷ୍ଟ ଦୃଷ୍ଟିର ସୀମା, ଦ୍ୱିତୀୟରେ ଦୋଷ ଏବଂ ତୃତୀୟରେ ଲେନ୍ସ ଦ୍ୱାରା ସଂଶୋଧନ।</desc><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Noto Sans Oriya, Noto Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="36" text-anchor="start" font-size="25" font-weight="700" fill="#203b42">ଦୂର ଦୃଷ୍ଟି ଓ ତାହାର ସଂଶୋଧନ</text><g transform="translate(16 55)"><rect x="0" y="0" width="716" height="164" rx="9" fill="white" stroke="#c5d2cc"/><text x="14" y="27" text-anchor="start" font-size="17" font-weight="650" fill="#203b42">a) ଦୂର ଦୃଷ୍ଟିଯୁକ୍ତ ବ୍ୟକ୍ତିର ନିକଟ ବିନ୍ଦୁ</text><ellipse cx="532" cy="82" rx="81" ry="63" fill="#f0f6f0" stroke="#667979" stroke-width="2"/><path d="M456 56 Q416 82 456 108" stroke="#667979" fill="#e8f3ef" stroke-width="2" /><path d="M 466 47 Q449 82 466 117 Q483 82 466 47 Z" stroke="#137369" fill="#c6e3dd" stroke-width="2" /><path d="M25 82 L680 82" stroke="#667979" fill="none" stroke-width="1" /><circle cx="50" cy="82" r="3" fill="#203b42"/><text x="50" y="103" text-anchor="middle" font-size="14" font-weight="400" fill="#203b42">N</text><path d="M50 82 L466 64" stroke="#137369" fill="none" stroke-width="2" /><path d="M 284.42 75.06 L 291.28 71.56 L 284.15 68.67" stroke="#137369" fill="none" stroke-width="2" /><path d="M466 64 L613 82" stroke="#af4c32" fill="none" stroke-width="2" /><path d="M 543.92 76.77 L 551.26 74.44 L 544.7 70.41" stroke="#af4c32" fill="none" stroke-width="2" /><path d="M50 82 L466 100" stroke="#137369" fill="none" stroke-width="2" /><path d="M 284.15 95.33 L 291.28 92.44 L 284.42 88.94" stroke="#137369" fill="none" stroke-width="2" /><path d="M466 100 L613 82" stroke="#af4c32" fill="none" stroke-width="2" /><path d="M 544.7 93.59 L 551.26 89.56 L 543.92 87.23" stroke="#af4c32" fill="none" stroke-width="2
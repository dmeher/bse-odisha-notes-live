<svg xmlns="http://www.w3.org/2000/svg" width="708" height="430" viewBox="0 0 708 430" role="img" aria-labelledby="title desc"><title id="title">ଜଳବିନ୍ଦୁରେ ଇନ୍ଦ୍ରଧନୁ ସୃଷ୍ଟି</title><desc id="desc">ସୂର୍ଯ୍ୟାଲୋକ ଜଳବିନ୍ଦୁରେ ପଶି ପ୍ରତିସରଣ ଓ ବର୍ଣ୍ଣ ବିକ୍ଷେପଣ, ଭିତରେ ପ୍ରତିଫଳନ ଓ ବାହାରିବା ବେଳେ ପୁଣି ପ୍ରତିସରଣ ହୁଏ।</desc><rect width="100%" height="100%" fill="#fffdf7"/><g font-family="Noto Sans Oriya, Noto Sans, sans-serif" stroke-linecap="round" stroke-linejoin="round"><text x="24" y="36" text-anchor="start" font-size="25" font-weight="700" fill="#203b42">ଜଳବିନ୍ଦୁରେ ଇନ୍ଦ୍ରଧନୁ ସୃଷ୍ଟି</text><ellipse cx="502" cy="176" rx="104" ry="104" fill="#e5f0ec" stroke="#667979" stroke-width="2.6"/><path d="M39 87.6 L447.21 87.6" stroke="#203b42" fill="none" stroke-width="3" /><path d="M 268.76 90.8 L 275.76 87.6 L 268.76 84.4" stroke="#203b42" fill="none" stroke-width="3" /><text x="45" y="75.6" text-anchor="start" font-size="19" font-weight="400" fill="#203b42">ସୂର୍ଯ୍ୟାଲୋକ</text><text x="488" y="63" text-anchor="start" font-size="18" font-weight="400" fill="#203b42">ଜଳବିନ୍ଦୁ</text><path d="M447.21 87.6 L599.53 139.89" stroke="#73549b" fill="none" stroke-width="2.25" /><path d="M 543.13 123.91 L 550.79 123.15 L 545.21 117.86" stroke="#73549b" fill="none" stroke-width="2.25" /><path d="M599.53 139.89 L518 278.76" stroke="#73549b" fill="none" stroke-width="2.25" /><path d="M 544.87 226.67 L 544.09 234.32 L 550.39 229.91" stroke="#73549b" fill="none" stroke-width="2.25" /><path d="M518 278.76 L398.04 381.72" stroke="#73549b" fill="none" stroke-width="2.25" /><path d="M 439.66 341.78 L 436.43 348.77 L 443.82 346.64" stroke="#73549b" fill="none" stroke-width="2.25" /><path d="M447.21 87.6 L598.98 138.45" stroke="#af4c32" fill="none" stroke-width="2.25" /><path d="M 542.76 122.99 L 550.42 122.18 L 544.8 116.92" stroke="#af4c32" fill="none" stroke-width="2.25" /><path d="M598.98 138.45 L521.03 278.24" stroke="#af4c32" fill="none" stroke-width="2.25" /><path d="M 546.59 225.84 L 545.98 233.51 L 552.18 
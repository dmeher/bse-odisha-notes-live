<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 366" role="img" aria-labelledby="title desc">
  <title id="title">କର୍ଣ୍ଣ AB ଚାରିପାଖରେ ସମକୋଣୀ ତ୍ରିଭୁଜର ଘୂର୍ଣ୍ଣନ</title>
  <desc id="desc">ସମକୋଣୀ ତ୍ରିଭୁଜ ABCର AC = 5 cm, BC = 12 cm ଓ AB = 13 cm। କର୍ଣ୍ଣ ABକୁ ଅକ୍ଷ ରଖି ଘୂରାଇଲେ C ବିନ୍ଦୁ ଏକ ବୃତ୍ତ ଆଙ୍କେ। CH ସେହି ବୃତ୍ତର ବ୍ୟାସାର୍ଦ୍ଧ। ବୃତ୍ତର ଦୁଇପଟେ A ଓ B ଶୀର୍ଷ ଥାଇ ଦୁଇଟି କୋନ୍ ଗଠିତ ହୁଏ।</desc>
  <rect width="520" height="366" rx="12" fill="#faf9f3"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 172 L103 33.5 L435 172 L103 310.5 Z" fill="#e4eeeb" stroke="#205851" stroke-width="2.5"/>
    <path d="M103 33.5 C72 33.5 72 310.5 103 310.5" fill="none" stroke="#558080" stroke-width="1.6" stroke-dasharray="5 5"/>
    <path d="M103 33.5 C134 33.5 134 310.5 103 310.5" fill="none" stroke="#447a71" stroke-width="2"/>
    <path d="M34 172 H456" fill="none" stroke="#455d69" stroke-width="1.6" stroke-dasharray="6 4"/>
    <path d="M103 33.5 V172" fill="none" stroke="#9a4e1d" stroke-width="2.2"/>
    <path d="M103 162 H113 V172 M98.8 43.6 L108.9 47.8 L113.1 37.7" fill="none" stroke="#315d57" stroke-width="1.4"/>
    <path d="M45 326 V338 M45 332 H435 M435 326 V338" fill="none" stroke="#71817f" stroke-width="1.3"/>
    <g fill="#205851"><circle cx="45" cy="172" r="3"/><circle cx="435" cy="172" r="3"/><circle cx="103" cy="33.5" r="3"/><circle cx="103" cy="172" r="2.8"/></g>
  </g>
  <g font-family="Arial,sans-serif" font-size="16" fill="#173f3c">
    <text x="24" y="183">A</text><text x="450" y="189">B</text><text x="98" y="23">C</text><text x="87" y="193">H</text>
    <text x="48" y="92" transform="rotate(-68 48 92)">5 cm</text>
    <text x="263" y="88" transform="rotate(22.6 263 88)">12 cm</text>
    <text x="218" y="353">13 cm</text>
    <text x="143" y="143" fill="#81441d">CH = 60/13 cm</text>
  </g>
</svg>

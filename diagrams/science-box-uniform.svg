<path d="M60 36 H326" stroke="#125c57" marker-end="url(#arrow)"/>
<path d="M60 72 H326" stroke="#125c57" marker-end="url(#arrow)"/>
<path d="M60 108 H326" stroke="#125c57" marker-end="url(#arrow)"/>

  <g stroke="#8ba79a" fill="none" stroke-dasharray="5 5" stroke-width="1.5"><path d="M76 165H213V244M76 86H350V244"/></g>
  <path d="M76 244 424 43" fill="none" stroke="#236959" stroke-width="3.5"/>
  <g fill="#b86e34"><circle cx="213" cy="165" r="5"/><circle cx="350" cy="86" r="5"/></g>
  <g font-family="sans-serif" font-size="17" fill="#263e35"><text x="49" y="269">O</text><text x="37" y="34">V (V)</text><text x="436" y="278">I (A)</text><text x="42" y="171">V₁</text><text x="42" y="92">V₂</text><text x="206" y="268">I₁</text><text x="343" y="268">I₂</text><text x="221" y="168">P</text><text x="358" y="88">Q</text></g>
